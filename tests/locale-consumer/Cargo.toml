[package]
name = "iso-types-locale-consumer"
version = "0.0.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
codes = { package = "iso-types", path = "../../crates/iso-types", features = [
  "locales",
  "fluent",
  "3166-2",
  "units",
  "unit-conversion",
  "full",
  "time-zone-localization",
  "phone-numbers",
] }
# Renamed so tests prove generated code reaches es-fluent through iso-types.
localized = { package = "es-fluent", version = "0.22.0", default-features = false }
es-fluent-manager-core = { workspace = true }
inventory = { workspace = true }

[dev-dependencies]
embedded = { package = "es-fluent-manager-embedded", version = "0.22.0" }

[build-dependencies]
es-fluent-build = { workspace = true }
