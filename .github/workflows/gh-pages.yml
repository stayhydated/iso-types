name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: stayhydated/shared/.github/workflows/deploy-pages.yml@86a30301bdf8e9dc07cacf82e79b1b7498272dfc
    with:
      dioxus-cli-version: 0.7.10
      build-command: |
        cargo xtask build book
        cargo xtask build llms-txt
        cargo xtask build web
