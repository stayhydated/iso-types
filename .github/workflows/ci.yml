name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m unittest discover -s tools/codegen/tests -v
      - run: python3 -m tools.codegen --check
      - run: cargo fmt --all --check
      - run: cargo test -p iso-types --locked
      - run: cargo test -p iso-types --no-default-features --locked
      - run: cargo test --workspace --all-features --locked
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.20.0"
      - name: Check locale-only builds through sccache
        run: python3 tools/check_locale_tracking.py --sccache
        env:
          SCCACHE_GHA_ENABLED: "true"
      - run: python3 tools/check_features.py --wasm
      - run: cargo check -p web --target wasm32-unknown-unknown --locked
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
