name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m unittest discover -s tools/codegen/tests -v
      - run: python3 -m tools.codegen --check
      - run: cargo fmt --all --check
      - run: cargo test -p iso-types --locked
      - run: cargo test -p iso-types --no-default-features --locked
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
