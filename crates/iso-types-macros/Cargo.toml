[package]
name = "iso-types-macros"
description = "ISO catalog subset and configured locale enum macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Original code and bundled data; see NOTICE for the scope of each license.
license = "(MIT OR Apache-2.0) AND LGPL-2.1-or-later AND Unicode-3.0 AND Apache-2.0 AND CC-BY-4.0"
repository.workspace = true

[lib]
proc-macro = true

[features]
fluent = []
locales = ["dep:es-fluent-toml", "dep:icu_locale", "dep:writeable"]

[dependencies]
es-fluent-toml = { workspace = true, optional = true }
heck = { workspace = true }
proc-macro-crate = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true }
icu_locale = { workspace = true, optional = true }
writeable = { workspace = true, optional = true }

[lints]
workspace = true
