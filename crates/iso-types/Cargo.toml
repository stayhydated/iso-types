[package]
name = "iso-types"
description = "Typed ISO, geographic, and regional catalogs with optional ICU4X, Jiff, and es-fluent integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Original code and bundled data; see NOTICE for the scope of each license.
license = "(MIT OR Apache-2.0) AND LGPL-2.1-or-later AND Unicode-3.0 AND Apache-2.0 AND CC-BY-4.0"
repository.workspace = true

[features]
default = [
  "fmt",
  "macros",
  "icu",
  "639-1",
  "3166-1",
  "4217",
  "15924",
  "5218",
  "8601",
]
full = [
  "639-1",
  "639-2",
  "639-3",
  "3166-1",
  "3166-2",
  "4217",
  "15924",
  "5218",
  "8601",
  "units",
  "regions",
  "regional-preferences",
  "unit-preferences",
  "language-relations",
  "time-zones",
  "calling-codes",
  "addresses",
  "numbering-systems",
  "216",
  "639-5",
  "10383",
  "trade-units",
  "packaging",
  "13616",
]
fmt = []
macros = ["dep:iso-types-macros"]
fluent = [
  "dep:es-fluent",
  "dep:es-fluent-manager-core",
  "dep:fluent-bundle",
  "dep:inventory",
  "iso-types-macros?/fluent",
]
icu = ["dep:icu_locale", "dep:icu_calendar"]
locales = [
  "macros",
  "icu",
  "iso-types-macros/locales",
  "dep:unic-langid",
  "dep:writeable",
  "dep:icu_provider",
]
639-1 = []
639-2 = []
639-3 = []
639-5 = []
216 = []
10383 = ["3166-1", "dep:csv"]
trade-units = []
packaging = []
13616 = ["3166-1"]
3166-1 = []
3166-2 = ["3166-1", "strum/phf"]
4217 = []
15924 = []
5218 = []
8601 = []
units = []
unit-conversion = ["units", "dep:icu_experimental"]
regions = ["3166-1"]
regional-preferences = ["3166-1", "8601", "icu"]
unit-preferences = ["units", "3166-1"]
language-relations = ["639-1", "3166-1", "15924", "icu"]
time-zones = ["3166-1", "dep:jiff"]
time-zone-localization = [
  "time-zones",
  "icu",
  "dep:icu_time",
  "dep:icu_datetime",
  "dep:writeable",
]
calling-codes = ["3166-1"]
phone-numbers = ["calling-codes", "dep:phonenumber"]
addresses = ["3166-1"]
numbering-systems = ["locales"]

[dependencies]
strum = { workspace = true }
csv = { workspace = true, optional = true }
iso-types-macros = { workspace = true, optional = true }
es-fluent = { workspace = true, optional = true }
es-fluent-manager-core = { workspace = true, optional = true }
fluent-bundle = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
unic-langid = { workspace = true, optional = true }
icu_locale = { workspace = true, optional = true }
icu_calendar = { workspace = true, optional = true }
writeable = { workspace = true, optional = true }
icu_provider = { workspace = true, optional = true }
icu_experimental = { workspace = true, optional = true }
icu_time = { workspace = true, optional = true }
icu_datetime = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
phonenumber = { workspace = true, optional = true }

[dev-dependencies]
fluent-syntax = { workspace = true }

[lints]
workspace = true

[[example]]
name = "market_registry"
required-features = ["10383"]
