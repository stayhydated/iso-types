[workspace]
members = ["crates/iso-types", "crates/iso-types-macros", "tests/locale-consumer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "(MIT OR Apache-2.0) AND LGPL-2.1-or-later"
repository = "https://github.com/stayhydated/iso-types"

[workspace.dependencies]
iso-types = { path = "crates/iso-types", version = "0.1.0" }
iso-types-macros = { path = "crates/iso-types-macros", version = "0.1.0" }
es-fluent = { git = "https://github.com/stayhydated/es-fluent", rev = "6eeb6057ae4796916ab5adfc1f1b4badd5b76a6c", version = "0.21.0", default-features = false }
es-fluent-manager-core = { git = "https://github.com/stayhydated/es-fluent", rev = "6eeb6057ae4796916ab5adfc1f1b4badd5b76a6c", version = "0.21.0" }
es-fluent-toml = { git = "https://github.com/stayhydated/es-fluent", rev = "6eeb6057ae4796916ab5adfc1f1b4badd5b76a6c", version = "0.21.0" }
fluent-bundle = "0.16"
fluent-syntax = "0.12"
heck = "0.5"
inventory = "0.3"
proc-macro-crate = "3.5"
proc-macro2 = "1.0"
quote = "1.0"
serde_json = "1.0"
syn = { version = "3.0", features = ["full"] }
unic-langid = { version = "0.9", features = ["macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
