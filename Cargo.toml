[workspace]
members = [
  "crates/iso-types",
  "crates/iso-types-macros",
  "crates/iso-types-locations",
  "tests/locale-consumer",
  "tools/icu-data",
  "web",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# Original code; public crates declare the additional bundled-data licenses.
license = "MIT OR Apache-2.0"
repository = "https://github.com/stayhydated/iso-types"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
dioxus = { version = "0.7", default-features = false }
es-fluent-build = "0.21.0"
es-fluent-manager-dioxus = { version = "0.21.0", default-features = false }
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "3136b369bb54312096ad83ba74735aab29109835" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "3136b369bb54312096ad83ba74735aab29109835" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "3136b369bb54312096ad83ba74735aab29109835" }
web = { path = "web" }
iso-types = { path = "crates/iso-types", version = "0.1.0" }
iso-types-locations = { path = "crates/iso-types-locations", version = "0.1.0" }
iso-types-macros = { path = "crates/iso-types-macros", version = "0.1.0" }
es-fluent = { version = "0.21.0", default-features = false }
es-fluent-manager-core = { version = "0.21.0" }
es-fluent-toml = { version = "0.21.0" }
fluent-bundle = "0.16"
fluent-syntax = "0.12"
heck = "0.5"
inventory = "0.3"
icu_locale = { version = "=2.3.1", features = ["unstable"] }
icu_calendar = "=2.3.0"
icu_datetime = "=2.3.0"
icu_experimental = "=0.6.0"
icu_provider = "=2.3.1"
icu_plurals = "=2.3.0"
icu_time = "=2.3.0"
jiff = { version = "=0.2.38", default-features = false, features = [
  "std",
  "tzdb-bundle-always",
] }
phonenumber = "0.3.10"
writeable = "0.6"
proc-macro-crate = "3.5"
proc-macro2 = "1.0"
quote = "1.0"
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
syn = { version = "3.0", features = ["full"] }
unic-langid = { version = "0.9", features = ["macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
